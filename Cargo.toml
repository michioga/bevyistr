[workspace]
resolver = "3"
members = [
    "app",
    "fem_core",
    "interaction",
    "selection",
    "visualization",
    "ui",
    "gmsh",
    "hecmw",
    "camera",
    "picking",
    "box_select",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Michio Ogawa (michioga)"]
license = "MIT"
repository = "https://github.com/michioga/bevyistr"

# Keep source-level crate names stable while publishing uniquely named packages.
[workspace.dependencies]
# Expand the 3D profile to omit compressed tone-mapping/SMAA LUTs and zstd.
# Both Bevy 0.19 zstd backends currently require vulnerable decoder versions.
# Cameras explicitly use LUT-free Reinhard; retain the other rendering features.
# Do not enable `3d`, `3d_api`, LUT features or defaults in member crates.
bevy = { version = "0.19", default-features = false, features = [
    "2d", "ui", "audio",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2",
    "morph_animation", "morph",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render",
    "bevy_anti_alias", "bevy_gltf", "bevy_pbr", "bevy_post_process", "gltf_animation",
] }
fem_core = { package = "bevyistr-fem-core", path = "fem_core", version = "=0.3.0" }
interaction = { package = "bevyistr-interaction", path = "interaction", version = "=0.3.0" }
selection = { package = "bevyistr-selection", path = "selection", version = "=0.3.0" }
visualization = { package = "bevyistr-visualization", path = "visualization", version = "=0.3.0" }
ui = { package = "bevyistr-ui", path = "ui", version = "=0.3.0" }
gmsh = { package = "bevyistr-gmsh", path = "gmsh", version = "=0.3.0" }
hecmw = { package = "bevyistr-hecmw", path = "hecmw", version = "=0.3.0" }
camera = { package = "bevyistr-camera", path = "camera", version = "=0.3.0" }
picking = { package = "bevyistr-picking", path = "picking", version = "=0.3.0" }
box_select = { package = "bevyistr-box-select", path = "box_select", version = "=0.3.0" }
