[package]
name = "ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32"] }
bevy = "0.19"
camera = { path = "../camera" }
fem_core = { path = "../fem_core" }
gmsh = { path = "../gmsh" }
hecmw = { path = "../hecmw" }
interaction = { path = "../interaction" }
picking = { path = "../picking" }
rfd = "0.15"
toml_edit = { version = "=0.25.11", default-features = false, features = ["parse"] }
selection = { path = "../selection" }
visualization = { path = "../visualization" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
